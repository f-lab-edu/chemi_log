name: Codex PR Review

# PR 이 열릴 때와 draft 를 벗을 때만 돈다.
#
# synchronize 를 넣지 않았다. codex-action 은 OPENAI_API_KEY 만 받는데 이것은 사용량 과금이라,
# synchronize 를 넣으면 커밋을 push 할 때마다 리뷰가 돌고 그만큼 청구된다.
# 리뷰를 반영한 뒤 다시 받고 싶으면 Actions 탭에서 이 워크플로를 직접 실행한다.
#
# **workflow_dispatch 는 이 파일이 기본 브랜치(main)에 올라가야 나타난다.** GitHub 의 제약이다.
# 이 파일이 머지되기 전까지 Actions 탭에 Run workflow 버튼이 없다.
# 그동안 다시 돌리려면 실패한 실행에서 "Re-run jobs" 를 쓴다.
#
# sonarcloud-analyze.yml 은 f-lab 이 넣은 파일이므로 건드리지 않는다. 이 파일은 별도다.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    # 프론트만 바뀐 PR 은 아예 돌지 않는다. paths-ignore 는 바뀐 파일이 **전부**
    # 여기 걸릴 때만 건너뛰므로, 백엔드가 섞인 PR 은 정상 실행된다.
    # 프론트는 전적으로 AI 가 쓰는 영역이라 자동 리뷰 대상이 아니다 (사용자 결정).
    paths-ignore:
      - 'frontend/**'
  # PR 코멘트에 `/review` 를 쓰면 돈다. 닫았다 열지 않고 다시 돌리는 수단이다.
  #
  # **이 트리거는 이 파일이 기본 브랜치(main)에 올라가야 동작한다.** GitHub 제약이고
  # workflow_dispatch 와 같은 이유다. PR 브랜치의 워크플로로 돌 수 있는 것은
  # pull_request 뿐이다. 그래야 아무나 PR 을 열어 임의 코드를 실행시키지 못한다.
  #
  # 그래서 PR #2 가 머지되기 전까지는 이 트리거가 아무 일도 하지 않는다.
  # 그동안 다시 돌리려면 PR 을 닫았다 연다.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '리뷰할 PR 번호'
        required: true
        type: string

# 같은 PR 에 대해 이전 실행이 남아 있으면 취소한다. 두 번 청구되지 않게 하려는 것이다.
concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # draft 는 건너뛴다. 아직 볼 준비가 안 된 코드에 비용을 쓰지 않는다.
    #
    # issue_comment 는 이슈에도 붙는 이벤트라 PR 인지 먼저 확인한다.
    # `/review` 로 시작하는 코멘트만 받고, **저장소 권한이 있는 사람만** 돌릴 수 있게 막는다.
    # 이 가드가 없으면 지나가는 사람이 코멘트 하나로 계정에 돈을 쓰게 만들 수 있다.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/review')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # 기본값이 360분이다. 리뷰가 헛돌면 그동안 계속 API 를 부르고 그만큼 청구된다.
    #
    # **이 값은 상한이 아니라 안전망이다.** 실제로 멈추는 것은 프롬프트의 파일 개수
    # 상한이어야 한다. 그쪽이 먼저 걸리면 여기까지 오지 않는다.
    #
    # 6회차 실측이 파일 15개에 1분 55초였다. 40개라도 5분 남짓이라 여유가 크다.
    #
    # 15분으로 두었을 때 3회차와 4회차가 연속으로 여기 걸려 결과 없이 끝났다.
    # 잘리면 job 이 cancelled 가 되고 post_feedback 이 skipped 라 코멘트가 남지 않는다.
    # 리뷰 비용만 나가고 산출물이 0 인 것이 가장 나쁘다. 그래서 30분으로 늘렸다.
    #
    # **모델을 바꿀 때 이 값을 같이 보라.** 비용은 시간이 아니라 토큰에 붙지만,
    # 시간이 길수록 토큰을 더 쓴다. 현재 모델(luna)로 30분이면 약 $0.2 다.
    # terra 로 올리면 같은 30분이 $1.4 이상이 된다. 그때는 이 값을 다시 내려라.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      # secrets 컨텍스트는 스텝의 if 에서 쓸 수 없어 env 로 넘겨 run 안에서 본다.
      # 이 가드가 없으면 codex-action 안쪽에서 프록시가 뜨지 않아 원인을 알기 어려운
      # 오류로 죽는다. 여기서 먼저 이유를 밝히고 멈춘다.
      - name: OPENAI_API_KEY 가 등록됐는지 확인한다
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY 시크릿이 없습니다. 아래로 등록하세요."
            echo "::error::gh secret set OPENAI_API_KEY --repo ${{ github.repository }}"
            exit 1
          fi

      - name: 리뷰할 PR 번호를 정한다
        id: pr
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
          COMMENT_PR: ${{ github.event.issue.number }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          PR="${EVENT_PR:-${COMMENT_PR:-$INPUT_PR}}"
          # 수동 실행에서 "#12" 처럼 적으면 ref 가 refs/pull/#12/merge 가 되어
          # 체크아웃이 이유 없이 죽는다. 숫자만 받는다.
          case "$PR" in
            ''|*[!0-9]*)
              echo "::error::PR 번호는 숫자만 입력합니다. 받은 값: '$PR'"
              exit 1
              ;;
          esac
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      # 충돌한 PR 은 merge ref 가 만들어지지 않는다. pull_request 이벤트는 충돌 시
      # 아예 발생하지 않아 안전하지만, workflow_dispatch 는 그 보호를 받지 않는다.
      # checkout 이 알아보기 어려운 메시지로 죽는 대신 여기서 이유를 밝힌다.
      - name: PR 의 merge ref 가 있는지 확인한다
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if ! git ls-remote --exit-code \
                 "https://github.com/${{ github.repository }}.git" \
                 "refs/pull/$PR_NUMBER/merge" >/dev/null 2>&1; then
            echo "::error::PR #$PR_NUMBER 의 merge ref 가 없습니다."
            echo "::error::base 와 충돌했거나 없는 PR 입니다. 충돌을 먼저 해결하세요."
            exit 1
          fi

      # merge ref 를 받는다. HEAD^1 이 base, HEAD^2 가 PR 의 head 다.
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
          persist-credentials: false
          fetch-depth: 0

      - name: Codex 리뷰 실행
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          # 모델을 비워 두면 Codex 가 서버에서 기본값을 받아 정한다. 그러면 어느 요금이
          # 적용될지 실행 전에 알 수 없다. 고정해서 비용을 예측 가능하게 둔다.
          #
          # 단가는 2026-08-27 에 developers.openai.com/api/docs/pricing 에서 확인했다.
          # 100만 토큰당 입력/출력이다. **주석에 적힌 값을 그대로 믿지 말고 다시 확인하라.**
          # 2026-07-30 에 luna 가 80%, terra 가 20% 인하돼 서열 자체가 한 번 바뀌었다.
          #
          #   gpt-5.6-luna    $0.20 / $1.20     5.6 세대
          #   gpt-5.6-terra   $2.00 / $12.00    5.6 세대
          #   gpt-5.3-codex   $1.75 / $14.00    5.3 세대
          #   gpt-5.6-sol     $4.00 / $20.00    5.6 세대
          #
          # **이 프로젝트는 luna 외의 모델에 접근 권한이 없다.** 5회차에서 terra 로
          # 올렸다가 11초 만에 거부당했다. 코드 문제가 아니라 계정 설정이다.
          #
          #   Project `proj_...` does not have access to model `gpt-5.6-terra`
          #
          # 모델을 올리려면 먼저 platform.openai.com 의 해당 프로젝트에서
          # Limits(또는 Model permissions)에 그 모델을 허용해야 한다.
          # **워크플로만 고치고 돌리면 11초짜리 실패가 반복된다.**
          #
          # 올릴 때는 terra 다. codex 가 아니다. 이 주석과 docs/worklog.md 가 한동안
          # codex 를 지목했는데 근거가 약하다. codex 는 한 세대 이전이고, gpt-5.4 부터
          # 코딩 특화 능력이 본선 모델에 흡수됐다. terra 가 더 최신이면서 출력이 싸다.
          model: gpt-5.6-luna
          # 출력 토큰이 입력의 6배 값이지만 luna 는 그 값이 싸서 high 를 써도 부담이 적다.
          #
          # **낮추지 마라.** 27분을 넘겨 취소한 뒤 한때 medium 으로 낮췄다가 되돌렸다.
          # 낮춘 것은 원인을 모르는 상태의 방어적 추측이었다.
          # medium 은 Codex CLI 기본값이라 지정하는 의미도 없다.
          #
          # 3회차까지 전부 시간 안에 끝내지 못했다. 빌드 시도를 막고도 15분을 다 썼으므로
          # 원인은 샌드박스 네트워크가 아니다. 그래서 4회차는 모델을 그대로 두고
          # 읽을 양을 줄이는 쪽과 부분 보고를 강제하는 쪽으로 갔다. 아래 프롬프트를 보라.
          #
          # 그래도 또 15분에 걸리면 그때 model 을 terra 로 올려라.
          effort: high
          prompt: |
            이 저장소의 PR #${{ steps.pr.outputs.number }} 를 리뷰한다.

            ## 리뷰 기준

            저장소 루트의 `AGENTS.md` 가 이 저장소 리뷰 기준의 유일한 출처다.
            **가장 먼저 읽고 그대로 따른다.** 거기 적힌 우선순위, "지적하지 말아야 할 것",
            리뷰 의견 구성, 보고 형식을 임의로 바꾸지 마라.

            **`AGENTS.md` 를 찾지 못하면 리뷰를 진행하지 마라.** 기준 없이 리뷰하면
            이 저장소가 의도적으로 정한 설계를 결함으로 올리게 된다. 그 경우
            "리뷰 기준 파일(`AGENTS.md`)이 저장소에 없어 리뷰를 진행하지 않았습니다" 라고만 답한다.

            ## 범위는 구현 레벨이다

            `AGENTS.md` 의 **"자동 PR 리뷰의 범위"** 절이 이 실행에 적용된다. 그 절을 그대로 따른다.

            요약하면 **구현이 틀린 곳만 본다.** 설계 의견은 달지 마라.
            패키지 배치, 추상화 수준, 네이밍, "이 패턴이 더 낫다" 는 전부 범위 밖이다.
            설계는 멘토가 본다. 봇이 그 자리를 차지하면 정작 봐야 할 구현 결함이 아래로 밀린다.

            애매하면 기준은 하나다. **"이대로 두면 언젠가 잘못 동작하는가."**

            `AGENTS.md` 의 문서 라우팅 표가 가리키는 `docs/domain.md`, `docs/database.md`,
            `docs/architecture.md` 는 저장소에 있다. 변경된 코드와 관련된 것을 읽어라.

            ## 이 실행 환경에서만 다른 것

            `AGENTS.md` 는 세 가지를 전제하는데 CI 에서는 성립하지 않는다.

            1. **`docs/worklog.md` 와 `docs/conventions.md` 는 이 저장소에 없다.**
               로컬 전용 파일이라 체크아웃에 포함되지 않는다. 없다고 해서 결함으로 보고하지 마라.
               "결정된 것" 과 "미해결 이슈" 를 볼 수 없으므로, 이미 합의된 설계를 새 결함으로
               올릴 위험이 있다. 코드 주석과 `docs/` 에 근거가 적혀 있으면 의도된 설계로 보라.
            2. **아무것도 실행할 수 없다.** `AGENTS.md` 는 재현해서 확인하라고 요구하지만
               여기는 네트워크가 차단된 샌드박스다. 아래를 **시도하지 마라.**

               ```
               ./gradlew  (test, build, compileJava 등 전부)
               npm, pnpm, yarn
               docker, docker compose        MySQL 기동 포함
               curl, wget, pip, mvn
               ```

               의존성을 받을 수 없어 성공할 수 없고, 네트워크 타임아웃에 매달려
               리뷰 시간을 전부 써 버린다. **실제로 그렇게 22분을 날리고 취소한 적이 있다.**

               쓸 수 있는 것은 **파일 읽기와 `git` 명령뿐**이다.

               **재현할 필요 없다.** 코드를 읽고 판단해서 보고하면 된다.
               확신도 표시는 그대로 쓴다. `AGENTS.md` 가 `CONFIRMED` 를
               "코드만으로 결함이 확정됨" 으로 정의하므로 재현 없이도 쓸 수 있다.
               맥락에 따라 의도된 동작일 수 있으면 `SUSPECT` 다.

               걸러야 할 것은 재현하지 않은 지적이 아니라 **근거가 약한 지적**이다.
               `AGENTS.md` 의 "입력이나 상태가 X일 때 Y가 발생한다" 를 한 문장으로
               쓸 수 없으면 보고하지 마라. 그 기준은 코드만 읽어도 지킬 수 있다.
            3. **위키(`PRD.md`, `API-규약.md`)도 이 저장소에 없다.** 별도 저장소라 체크아웃에
               포함되지 않는다. `AGENTS.md` 와 `docs/` 가 위키를 최종 근거로 인용하는 대목이
               여럿 있는데, 그 내용은 확인할 수 없다. **확인하지 못한 규약을 근거로 지적하지 마라.**
               응답 형식이나 에러 코드가 규약과 다른 것 같아도, 코드와 `docs/` 만으로
               확정할 수 없으면 보고하지 않는다.

            ## 볼 범위

            PR 의 변경분만 본다. 아래로 확인한다.

            ```
            git diff HEAD^1 HEAD          변경 내용
            git diff --stat HEAD^1 HEAD   변경 파일 목록
            ```

            변경되지 않은 기존 코드는 지적 대상이 아니다.
            다만 변경분을 이해하는 데 필요하면 읽어도 된다.

            **`frontend/` 는 보지 마라.** 변경분에 섞여 있어도 건너뛴다.
            백엔드와 계약이 어긋나는지도 보지 마라. 그 판단은 사람이 한다.

            **아래도 건너뛴다.** 구현 결함이 나올 곳이 아닌데 읽는 양만 차지한다.

            ```
            README.md
            AGENTS.md              리뷰 기준으로 읽되 리뷰 대상은 아니다
            .github/**             이 워크플로 파일 자신을 리뷰할 이유가 없다
            backend/build.gradle
            ```

            **볼 것은 `backend/`, `database/`, `docs/` 다.** 테스트도 코드이므로 본다.

            ## 시간 안에 반드시 결과를 남겨라

            **가장 나쁜 결과는 아무 보고 없이 시간이 끝나는 것이다.** 실제로 세 번 그랬다.
            이 실행은 15분에 강제 종료되고, 그때까지 보고를 마치지 못하면
            PR 에 코멘트가 달리지 않는다. 리뷰 비용만 나가고 남는 것이 없다.

            그러므로 **완벽을 노리지 마라.**

            **읽을 파일 수에 상한을 둔다. 최대 40개다.**
            너는 경과 시간을 알 수 없으므로 시간으로 판단하지 마라. 대신 센다.

            ```
            1. git diff --stat HEAD^1 HEAD 로 변경 파일 목록을 먼저 본다
            2. 위 "볼 범위" 에 해당하는 것만 남긴다
            3. 그중 중요해 보이는 순으로 최대 40개를 고른다
            4. 40개를 열었으면 더 열지 말고 그때까지 찾은 것으로 보고를 마친다
            ```

            읽은 파일 수가 40개에 닿았는데 아직 보지 못한 파일이 남았다면,
            보고 끝에 `읽지 못한 파일: N개` 라고 한 줄 남겨라. 그것도 쓸모 있는 정보다.

            - 확실한 결함을 찾으면 탐색을 계속하기 전에 그것부터 확정해 둔다
            - **같은 파일을 두 번 읽지 마라.** 한 번 읽고 판단한다
            - 찾은 것이 하나도 없어도 "발견된 결함 없음" 이라고 반드시 답한다.
              빈 응답으로 끝내지 마라

            변경분이 전부 `frontend/` 라면 "이번 변경은 프론트엔드뿐이라 리뷰 대상이
            없습니다" 라고만 답한다.

            ## 출력

            GitHub PR 코멘트로 그대로 올라간다. 마크다운으로 쓴다.

            - **한국어 존댓말로 쓴다.** 종결은 `~합니다` 로 통일한다
            - **줄표를 쓰지 않는다.** 삽입구는 괄호로, 문장 연결은 두 문장으로 나눈다
            - 문단은 한 줄로 쓴다. GitHub 이 단일 개행을 `<br>` 로 렌더링하므로
              80자에서 끊으면 문장 중간이 끊겨 보인다. 표와 코드블록과 목록은 예외다
            - 각 지적에 `파일:줄번호` 와 확신도(`CONFIRMED` / `SUSPECT`)를 붙인다
            - 심각한 순으로 최대 7건이다. 개수를 채우려고 억지로 만들지 마라
            - 기준을 통과하는 항목이 없으면 "발견된 결함 없음" 이라고만 쓴다

      - name: 리뷰 결과가 비었는지 확인한다
        if: steps.run_codex.outputs.final-message == ''
        run: echo "::warning::Codex 가 빈 응답을 돌려줬다. API 키와 사용량 한도를 확인하라."

  post_feedback:
    needs: review
    if: needs.review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # GitHub App 없이 워크플로 기본 토큰으로 코멘트를 단다.
      # 저장소의 default_workflow_permissions 가 write 라 그대로 동작한다.
      # v9 에는 breaking change 가 있다. v8 은 v7 에서 Node 24 로 런타임만 올린 버전이다.
      - name: PR 에 리뷰 코멘트를 단다
        uses: actions/github-script@v8
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.review.outputs.final_message }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = [
              '## Codex 리뷰',
              '',
              '기준은 `AGENTS.md` 입니다. 자동으로 실행됐습니다.',
              '',
              '---',
              '',
              process.env.CODEX_FINAL_MESSAGE,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'edu.flab'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot BOM. 아래 의존성에 버전을 적지 않는 이유다.
    // io.spring.dependency-management 플러그인 대신 Gradle 네이티브 platform 을 쓴다.
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    // Spring Boot 4 에서 spring-boot-starter-web 이 spring-boot-starter-webmvc 로 바뀌었다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // Spring Boot 4 는 통합 spring-boot-starter-test 대신 모듈별 테스트 스타터를 쓴다.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'

    // DB 를 쓰는 테스트는 실제 MySQL 8.4 에 붙는다. 인메모리 DB 는 쓰지 않는다.
    // H2 는 이 스키마의 ENUM, 컬럼별 collation, ON DELETE 동작을 재현하지 못한다
    // (docs/architecture.md 의 테스트 구조).
    //
    // Testcontainers 2.x 에서 artifactId 앞에 testcontainers- 가 붙었다. 옛 이름
    // (org.testcontainers:junit-jupiter, :mysql)은 Boot 4.1.1 의 BOM 에 없어서
    // 버전이 빈 값이 되고 의존성 해석에서 죽는다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
}

tasks.named('test') {
    useJUnitPlatform()

    // MySqlContainerConfig 가 이 경로를 런타임에 읽어서 Gradle 은 입력인 줄 모른다.
    // 선언하지 않으면 01-schema.sql 을 고쳐도 test 가 UP-TO-DATE 로 건너뛰고,
    // ddl-auto 가 none 이라 어긋남이 드러나지 않는다.
    inputs.dir(file('../database/init'))
            .withPathSensitivity(PathSensitivity.RELATIVE)
            .withPropertyName('databaseInitScripts')
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'edu.flab'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot BOM. 아래 의존성에 버전을 적지 않는 이유다.
    // io.spring.dependency-management 플러그인 대신 Gradle 네이티브 platform 을 쓴다.
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    // Spring Boot 4 에서 spring-boot-starter-web 이 spring-boot-starter-webmvc 로 바뀌었다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // Spring Boot 4 는 통합 spring-boot-starter-test 대신 모듈별 테스트 스타터를 쓴다.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'

    // 통합 테스트는 실제 MySQL 8.4 에 붙는다. 스키마의 ENUM, CHECK, 복합 FK,
    // utf8mb4_0900_bin collation 은 H2 로 재현되지 않아 인메모리 DB 로는 검증할 수 없다.
    //
    // Boot 4.1.1 의 BOM 이 Testcontainers 2.0.5 를 가리킨다. 2.x 에서 artifactId 앞에
    // testcontainers- 가 붙었다. 옛 이름(junit-jupiter, mysql)은 BOM 에 없어서 버전이
    // 빈 값으로 남고 의존성 해석 단계에서 빌드가 멈춘다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
}

tasks.named('test') {
    useJUnitPlatform()
}

services:
  mysql:
    image: mysql:8.4
    container_name: chemi-log-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chemi_log}
      MYSQL_USER: ${MYSQL_USER:-chemilog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      # 최초 기동(볼륨이 비어 있을 때)에만 실행된다.
      # 스키마를 고친 뒤에는 `docker compose down -v` 로 볼륨을 지워야 다시 반영된다.
      - ./init:/docker-entrypoint-initdb.d:ro
      - chemi-log-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  chemi-log-mysql-data:
